name: Archfit
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
  id-token: write
jobs:
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: alexei-led/archfit-action@9669571b7b25e3f37fd7f1d99d7b89741c6c95d6 # v4.0.0
        with:
          endpoint: https://app.coupling.dev
          audience: https://app.coupling.dev
