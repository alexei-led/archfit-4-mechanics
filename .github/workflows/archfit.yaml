name: Archfit
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
  id-token: write
jobs:
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: coupling-dev/archfit-action@53e0c49d80627efa4262d7ee78c56dd6054a6e43 # v0.9.0
        with:
          endpoint: https://app.coupling.dev
          audience: https://app.coupling.dev
